<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRP.ai — Messenger</title>
    <link rel="icon" href="img/favicon.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .chat-messages {
            max-width: 720px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .chat-input-bar {
            max-width: 720px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .back-icon {
            height: 24px;
            width: auto;
            display: block;
        }

        #convSendBtn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            padding: 6px;
            cursor: pointer;
        }
        #convSendBtn:disabled {
            opacity: 0.5;
            cursor: default;
        }
        .send-icon {
            width: 28px;
            height: 28px;
            display: block;
        }
    </style>
</head>
<body class="messenger-page">

    <header class="chat-header">
        <a href="/" class="back-link">
            <img src="img/back.png" alt="Back" class="back-icon">
        </a>
        <div class="chat-header-info">
            <div class="logo">WRP.ai</div>
        </div>
    </header>

    <div class="messenger-layout" id="messengerLayout">

        <!-- Левая колонка: список чатов -->
        <aside class="messenger-list-pane" id="messengerListPane">
            <div class="messenger-list-header">
                <h2>Chats</h2>
            </div>
            <div class="messenger-list" id="messengerList">
                <p class="loading-text">Loading your chats...</p>
            </div>
        </aside>

        <!-- Правая колонка: переписка -->
        <section class="messenger-conversation-pane" id="messengerConversationPane">
            <div class="messenger-empty-state" id="messengerEmptyState">
                <img src="img/click.png" class="messenger-empty-icon" alt="">
                <p>Select a chat to start messaging</p>
            </div>

            <div class="messenger-conversation" id="messengerConversation" hidden>
                <header class="messenger-conv-header">
                    <button class="messenger-back-btn" id="messengerBackBtn" type="button">
                        <img src="img/back.png" alt="Back" class="back-icon">
                    </button>
                    <div class="chat-avatar" id="convAvatar"></div>
                    <div class="chat-header-text">
                        <div class="chat-char-name" id="convCharName">Loading...</div>
                        <div class="chat-char-meta" id="convCharMeta"></div>
                    </div>
                </header>

                <main class="chat-messages" id="convMessages"></main>

                <form class="chat-input-bar" id="convForm">
                    <textarea id="convInput" placeholder="Type a message..." maxlength="2000" rows="1" required></textarea>
                    <button type="submit" id="convSendBtn"><img src="img/send.png" alt="Send" class="send-icon"></button>
                </form>
            </div>
        </section>

    </div>

    <script type="module">
        import { requireAuthOrRedirect, authFetch } from '/js/auth.js';

        const user = requireAuthOrRedirect();

        if (user) {
            const listEl = document.getElementById('messengerList');
            let chats = [];

            function formatTime(ts) {
                const date = new Date(ts);
                const now = new Date();
                const isToday = date.toDateString() === now.toDateString();
                return isToday
                    ? date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    : date.toLocaleDateString();
            }

            function renderChatList() {
                if (chats.length === 0) {
                    listEl.innerHTML = '<p class="loading-text">No conversations yet. Start chatting with a character!</p>';
                    return;
                }

                listEl.innerHTML = '';
                chats.forEach(chat => {
                    const item = document.createElement('div');
                    item.className = 'messenger-list-item';
                    item.dataset.charId = chat.char_id;

                    const preview = chat.last_role === 'user' ? `You: ${chat.last_message}` : chat.last_message;

                    item.innerHTML = `
                        <div class="messenger-list-avatar" style="background-image: url('${chat.avatar_url || ''}')"></div>
                        <div class="messenger-list-info">
                            <div class="messenger-list-name">${chat.char_name}</div>
                            <div class="messenger-list-preview">${preview}</div>
                        </div>
                        <div class="messenger-list-time">${formatTime(chat.last_timestamp)}</div>
                    `;

                    item.addEventListener('click', () => openConversation(chat.char_id));
                    listEl.appendChild(item);
                });
            }

            async function loadChats() {
                try {
                    const res = await authFetch('/api/profile/chats');
                    if (!res.ok) throw new Error(`Server responded with ${res.status}`);
                    chats = await res.json();
                    renderChatList();

                    // Если пришли по прямой ссылке messenger.html?id=charId — сразу открыть переписку
                    const params = new URLSearchParams(window.location.search);
                    const openId = params.get('id');
                    if (openId) openConversation(openId);
                } catch (err) {
                    console.error('Error loading chats:', err);
                    listEl.innerHTML = '<p class="error-text">Failed to load your chats.</p>';
                }
            }

            loadChats();

                    // --- Conversation (правая панель) ---
        const emptyStateEl = document.getElementById('messengerEmptyState');
        const conversationEl = document.getElementById('messengerConversation');
        const convMessagesEl = document.getElementById('convMessages');
        const convForm = document.getElementById('convForm');
        const convInput = document.getElementById('convInput');
        const convSendBtn = document.getElementById('convSendBtn');
        const convAvatarEl = document.getElementById('convAvatar');
        const convNameEl = document.getElementById('convCharName');
        const convMetaEl = document.getElementById('convCharMeta');
        const messengerBackBtn = document.getElementById('messengerBackBtn');
        const messengerLayout = document.getElementById('messengerLayout');

        let currentCharId = null;
        const violenceLabels = { mild: 'Mild', medium: 'Medium', graphic: 'Graphic' };

        function renderMessage(role, content) {
            const wrapper = document.createElement('div');
            wrapper.className = `chat-message ${role === 'user' ? 'chat-message-user' : 'chat-message-assistant'}`;
            const bubble = document.createElement('div');
            bubble.className = 'chat-bubble';
            bubble.textContent = content;
            wrapper.appendChild(bubble);
            convMessagesEl.appendChild(wrapper);
        }

        function scrollToBottom() {
            convMessagesEl.scrollTop = convMessagesEl.scrollHeight;
        }

        window.openConversation = async function (charId) {
            currentCharId = charId;
            emptyStateEl.hidden = true;
            conversationEl.hidden = false;
            messengerLayout.classList.add('conversation-open'); // для мобильного вида

            // Подсветка активного элемента в списке
            document.querySelectorAll('.messenger-list-item').forEach(el => {
                el.classList.toggle('active', el.dataset.charId === charId);
            });

            convNameEl.textContent = 'Loading...';
            convMessagesEl.innerHTML = '<p class="loading-text">Loading conversation...</p>';

            try {
                const charRes = await fetch(`/api/characters/${charId}`);
                if (!charRes.ok) throw new Error('Character not found');
                const character = await charRes.json();

                convNameEl.textContent = character.name;
                convMetaEl.textContent = `${character.language.toUpperCase()} · ${violenceLabels[character.violence_level] || character.violence_level}`;
                if (character.avatar_url) {
                    convAvatarEl.style.backgroundImage = `url('${character.avatar_url}')`;
                } else {
                    convAvatarEl.textContent = character.name.charAt(0).toUpperCase();
                }

                const historyRes = await authFetch(`/api/chat/${charId}`);
                convMessagesEl.innerHTML = '';

                if (historyRes.ok) {
                    const history = await historyRes.json();
                    if (history.length === 0) {
                        convMessagesEl.innerHTML = '<p class="loading-text">Say hello to start the conversation.</p>';
                    } else {
                        history.forEach(msg => renderMessage(msg.role, msg.content));
                        scrollToBottom();
                    }
                } else {
                    convMessagesEl.innerHTML = '<p class="error-text">Failed to load conversation history.</p>';
                }
            } catch (err) {
                console.error('Error loading conversation:', err);
                convNameEl.textContent = 'Character not found';
                convMessagesEl.innerHTML = '<p class="error-text">Failed to load this character.</p>';
            }
        }

        async function sendMessage() {
            const text = convInput.value.trim();
            if (!text || !currentCharId) return;

            const placeholder = convMessagesEl.querySelector('.loading-text');
            if (placeholder) placeholder.remove();

            renderMessage('user', text);
            scrollToBottom();
            convInput.value = '';
            convInput.disabled = true;
            convSendBtn.disabled = true;

            try {
                const response = await authFetch(`/api/chat/${currentCharId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text }),
                });
                if (!response.ok) throw new Error(`Server responded with ${response.status}`);

                const data = await response.json();
                renderMessage('assistant', data.reply);
                scrollToBottom();
            } catch (err) {
                console.error('Error sending message:', err);
                renderMessage('assistant', '⚠️ Failed to get a response. Please try again.');
                scrollToBottom();
            } finally {
                convInput.disabled = false;
                convSendBtn.disabled = false;
                convInput.focus();
            }
        }

        convForm.addEventListener('submit', (e) => {
            e.preventDefault();
            sendMessage();
        });

        messengerBackBtn.addEventListener('click', () => {
            messengerLayout.classList.remove('conversation-open');
        });
        }
    </script>
</body>
</html>
