<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRP.ai — Login</title>
    <link rel="icon" href="img/favicon.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <a href="/" class="login-back">
        <img src="img/back.png" alt="Back" class="back-icon">
    </a>

    <div class="login-container">
        <div class="login-left">
            <h1 class="login-welcome">Welcome to wrpAI</h1>

            <form id="loginForm" novalidate>
                <div class="login-input-group">
                    <img src="img/email.png" alt="" class="login-input-icon">
                    <input type="email" id="emailInput" placeholder="Email" autocomplete="email" required>
                </div>

                <div class="login-input-group">
                    <img src="img/pass.png" alt="" class="login-input-icon">
                    <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password" required>
                </div>

                <div class="login-links-row">
                    <a href="#" class="login-link" id="signUpLink">Sign up</a>
                    <a href="#" class="login-link" id="forgotLink">Forgot password?</a>
                </div>
            </form>

            <div class="login-divider"><span>or</span></div>

            <button id="googleSignInBtn" class="google-btn">
                <img src="img/google.png" alt="Google" class="google-icon">
                <span>Log in with Google</span>
            </button>

            <p id="loginError" class="login-error" hidden></p>
        </div>

        <div class="login-right">
            <img src="img/login-banner.gif" alt="" class="login-banner-gif">
        </div>
    </div>

    <script type="module">
        import { signInWithGoogle, getCachedUser } from '/js/auth.js';

        // Если уже залогинены — сразу на главную
        if (getCachedUser()) {
            window.location.href = '/';
        }

        const btn = document.getElementById('googleSignInBtn');
        const errorEl = document.getElementById('loginError');

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            errorEl.hidden = true;
            try {
                await signInWithGoogle();
                window.location.href = '/';
            } catch (e) {
                console.error('Login error:', e);
                errorEl.textContent = 'Failed to log in with Google. Please try again.';
                errorEl.hidden = false;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
