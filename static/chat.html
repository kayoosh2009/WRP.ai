<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRP.ai — Chat</title>
    <link rel="icon" href="img/favicon.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Центрируем переписку и поле ввода на широких экранах */
        .chat-messages {
            max-width: 720px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .chat-input-bar {
            max-width: 720px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .back-icon {
            height: 24px;
            width: auto;
            display: block;
        }

        #chatSendBtn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            padding: 6px;
            cursor: pointer;
        }
        #chatSendBtn:disabled {
            opacity: 0.5;
            cursor: default;
        }
        .send-icon {
            width: 28px;
            height: 28px;
            display: block;
        }
        </style>
</head>
<body class="chat-page">

    <header class="chat-header">
        <a href="/" class="back-link">
    <img src="img/back.png" alt="Back" class="back-icon">
</a>
        <div class="chat-header-info">
            <div class="chat-avatar" id="chatAvatar"></div>
            <div class="chat-header-text">
                <div class="chat-char-name" id="chatCharName">Loading...</div>
                <div class="chat-char-meta" id="chatCharMeta"></div>
            </div>
        </div>
        <button class="settings-btn" id="settingsBtn" title="Chat settings" type="button">⚙</button>
    </header>

    <main class="chat-messages" id="chatMessages">
        <p class="loading-text">Loading conversation...</p>
    </main>

    <form class="chat-input-bar" id="chatForm">
        <textarea id="chatInput" placeholder="Type a message..." maxlength="2000" rows="1" required></textarea>
        <button type="submit" id="chatSendBtn"><img src="img/send.png" alt="Send" class="send-icon"></button>
    </form>

    <!-- Settings modal -->
    <div class="modal-overlay" id="settingsModalOverlay">
        <div class="modal-card settings-card">
            <h3>Chat settings</h3>

            <div class="settings-group">
                <label>Response length</label>
                <div class="settings-options" id="lengthOptions">
                    <button type="button" class="settings-option" data-value="short">Short</button>
                    <button type="button" class="settings-option" data-value="medium">Medium</button>
                    <button type="button" class="settings-option" data-value="long">Long</button>
                </div>
            </div>

            <div class="settings-group settings-toggle-row">
                <label for="typingEffectToggle">Live typing effect</label>
                <input type="checkbox" id="typingEffectToggle">
            </div>

            <div class="settings-group">
                <button type="button" class="settings-danger-btn" id="deleteHistoryBtn">Delete chat history</button>
            </div>

            <button type="button" class="modal-btn-primary" id="settingsCloseBtn">Done</button>
        </div>
    </div>

    <script type="module">
        import { requireAuthOrRedirect, getFreshIdToken, authFetch } from '/js/auth.js';
        import { getSettings, saveSettings } from '/js/settings.js';
        import { renderLiteMarkdown } from '/js/markdown.js';

        const user = requireAuthOrRedirect();

        if (user) {
            const params = new URLSearchParams(window.location.search);
            const charId = params.get('id');

            const messagesEl = document.getElementById('chatMessages');
            const form = document.getElementById('chatForm');
            const input = document.getElementById('chatInput');
            const sendBtn = document.getElementById('chatSendBtn');
            const avatarEl = document.getElementById('chatAvatar');
            const nameEl = document.getElementById('chatCharName');
            const metaEl = document.getElementById('chatCharMeta');

            if (!charId) {
                window.location.href = '/';
            }

            // --- Settings modal ---
            let settings = getSettings();
            const settingsBtn = document.getElementById('settingsBtn');
            const settingsOverlay = document.getElementById('settingsModalOverlay');
            const settingsCloseBtn = document.getElementById('settingsCloseBtn');
            const lengthOptions = document.querySelectorAll('#lengthOptions .settings-option');
            const typingEffectToggle = document.getElementById('typingEffectToggle');

            function refreshSettingsUi() {
                lengthOptions.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.value === settings.responseLength);
                });
                typingEffectToggle.checked = settings.typingEffect;
            }

            settingsBtn.addEventListener('click', () => {
                refreshSettingsUi();
                settingsOverlay.classList.add('active');
            });

            settingsCloseBtn.addEventListener('click', () => {
                settingsOverlay.classList.remove('active');
            });

            lengthOptions.forEach(btn => {
                btn.addEventListener('click', () => {
                    settings.responseLength = btn.dataset.value;
                    saveSettings(settings);
                    refreshSettingsUi();
                });
            });

            typingEffectToggle.addEventListener('change', () => {
                settings.typingEffect = typingEffectToggle.checked;
                saveSettings(settings);
            });

            const deleteHistoryBtn = document.getElementById('deleteHistoryBtn');
            deleteHistoryBtn.addEventListener('click', async () => {
                if (!confirm('Delete this whole conversation? This cannot be undone.')) return;

                deleteHistoryBtn.disabled = true;
                deleteHistoryBtn.textContent = 'Deleting...';
                try {
                    const res = await authFetch(`/api/chat/${charId}`, { method: 'DELETE' });
                    if (!res.ok) throw new Error(`Server responded with ${res.status}`);
                    messagesEl.innerHTML = '<p class="loading-text">Say hello to start the conversation.</p>';
                    settingsOverlay.classList.remove('active');
                } catch (err) {
                    console.error('Error deleting chat history:', err);
                    alert('Failed to delete chat history.');
                } finally {
                    deleteHistoryBtn.disabled = false;
                    deleteHistoryBtn.textContent = 'Delete chat history';
                }
            });

            // --- Messages rendering ---
            function renderMessage(role, content) {
                const wrapper = document.createElement('div');
                wrapper.className = `chat-message ${role === 'user' ? 'chat-message-user' : 'chat-message-assistant'}`;
                const bubble = document.createElement('div');
                bubble.className = 'chat-bubble';
                bubble.innerHTML = renderLiteMarkdown(content);
                wrapper.appendChild(bubble);
                messagesEl.appendChild(wrapper);
                return bubble;
            }

            function scrollToBottom() {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            // Имитация "живой" печати: раскрываем текст по кусочкам во времени.
            // Это не настоящий stream от модели, просто визуальный эффект.
            function typeOutMessage(bubble, fullHtmlText, plainLength) {
                return new Promise(resolve => {
                    if (!settings.typingEffect) {
                        bubble.innerHTML = fullHtmlText;
                        resolve();
                        return;
                    }
                    // Печатаем по символам исходного текста, рендеря маркдаун на лету
                    let shown = 0;
                    const totalMs = Math.min(1800, Math.max(300, plainLength * 12));
                    const stepMs = Math.max(8, totalMs / plainLength);

                    const raw = bubble.dataset.raw || '';
                    const interval = setInterval(() => {
                        shown++;
                        bubble.innerHTML = renderLiteMarkdown(raw.slice(0, shown)) + '<span class="typing-cursor">▍</span>';
                        scrollToBottom();
                        if (shown >= raw.length) {
                            clearInterval(interval);
                            bubble.innerHTML = renderLiteMarkdown(raw);
                            resolve();
                        }
                    }, stepMs);
                });
            }

            function setLoadingReply(show) {
                let el = document.getElementById('typingIndicator');
                if (show) {
                    if (!el) {
                        el = document.createElement('div');
                        el.id = 'typingIndicator';
                        el.className = 'chat-message chat-message-assistant';
                        el.innerHTML = '<div class="chat-bubble chat-typing">...</div>';
                        messagesEl.appendChild(el);
                        scrollToBottom();
                    }
                } else if (el) {
                    el.remove();
                }
            }

            const violenceLabels = { mild: 'Mild', medium: 'Medium', graphic: 'Graphic' };

            async function loadCharacterAndHistory() {
                try {
                    const charRes = await fetch(`/api/characters/${charId}`);

                    if (!charRes.ok) throw new Error('Character not found');
                    const character = await charRes.json();

                    nameEl.textContent = character.name;
                    metaEl.textContent = `${character.language.toUpperCase()} · ${violenceLabels[character.violence_level] || character.violence_level}`;
                    if (character.avatar_url) {
                        avatarEl.style.backgroundImage = `url('${character.avatar_url}')`;
                    } else {
                        avatarEl.textContent = character.name.charAt(0).toUpperCase();
                    }

                    const historyRes = await authFetch(`/api/chat/${charId}`);

                    messagesEl.innerHTML = '';

                    if (historyRes.ok) {
                        const history = await historyRes.json();
                        if (history.length === 0) {
                            messagesEl.innerHTML = '<p class="loading-text">Say hello to start the conversation.</p>';
                        } else {
                            history.forEach(msg => renderMessage(msg.role, msg.content));
                            scrollToBottom();
                        }
                    } else {
                        messagesEl.innerHTML = '<p class="error-text">Failed to load conversation history.</p>';
                    }
                } catch (err) {
                    console.error('Error loading chat:', err);
                    nameEl.textContent = 'Character not found';
                    messagesEl.innerHTML = '<p class="error-text">Failed to load this character.</p>';
                }
            }

            async function sendMessage() {
                const text = input.value.trim();
                if (!text) return;

                const placeholder = messagesEl.querySelector('.loading-text');
                if (placeholder) placeholder.remove();

                renderMessage('user', text);
                scrollToBottom();
                input.value = '';
                autoResize();
                input.disabled = true;
                sendBtn.disabled = true;
                setLoadingReply(true);
                
                try {
                    const response = await authFetch(`/api/chat/${charId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text, response_length: settings.responseLength }),
                    });

                    if (!response.ok) throw new Error(`Server responded with ${response.status}`);

                    const data = await response.json();
                    setLoadingReply(false);

                    const bubble = renderMessage('assistant', '');
                    bubble.dataset.raw = data.reply;
                    bubble.innerHTML = '';
                    await typeOutMessage(bubble, renderLiteMarkdown(data.reply), data.reply.length);
                    scrollToBottom();
                } catch (err) {
                    console.error('Error sending message:', err);
                    setLoadingReply(false);
                    renderMessage('assistant', '⚠️ Failed to get a response. Please try again.');
                    scrollToBottom();
                } finally {
                    input.disabled = false;
                    sendBtn.disabled = false;
                    input.focus();
                }
            }

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                sendMessage();
            });

            // Автоувеличение textarea по высоте контента
            function autoResize() {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 140) + 'px';
            }
            input.addEventListener('input', autoResize);

            // Enter/Shift+Enter только на устройствах с клавиатурой (не touch).
            // На тач-устройствах Enter просто переносит строку, отправка — только кнопкой.
            const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey && !isTouchDevice) {
                    e.preventDefault();
                    sendMessage();
                }
                // Shift+Enter и обычный Enter на тач-устройствах — обычный перенос строки, ничего не делаем
            });

            loadCharacterAndHistory();
        }
    </script>
</body>
</html>
