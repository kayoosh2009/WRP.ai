<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRP.ai</title>
    <link rel="icon" href="img/favicon.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Верхняя панель (Header) -->
    <header class="top-bar">
        <div class="header-left">
            <button class="menu-toggle" id="menuToggle" onclick="toggleMenu()">
                <img src="img/menu.png" alt="Menu" id="menuIcon" class="menu-icon">
            </button>
            <div class="logo">WRP.ai</div>
        </div>
        
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search characters...">
            <button class="filter-toggle-btn" id="filterToggleBtn" type="button">Filters</button>
        </div>

        <div class="filter-panel" id="filterPanel" hidden>
            <div class="filter-group">
                <label>Sort by popularity</label>
                <div class="filter-options">
                    <label class="filter-checkbox">
                        <input type="radio" name="sortOrder" value="popular" checked> Popular first
                    </label>
                    <label class="filter-checkbox">
                        <input type="radio" name="sortOrder" value="unpopular"> Least popular first
                    </label>
                </div>
            </div>

            <div class="filter-group">
                <label>Story intensity</label>
                <div class="filter-options">
                    <label class="filter-checkbox">
                        <input type="checkbox" id="violenceAll" checked> All
                    </label>
                    <label class="filter-checkbox">
                        <input type="checkbox" class="violenceFilter" value="mild" checked> Mild
                    </label>
                    <label class="filter-checkbox">
                        <input type="checkbox" class="violenceFilter" value="medium" checked> Medium
                    </label>
                    <label class="filter-checkbox">
                        <input type="checkbox" class="violenceFilter" value="graphic" checked> Graphic
                    </label>
                </div>
            </div>

            <div class="filter-group">
                <label>Language</label>
                <div class="filter-options">
                    <label class="filter-checkbox">
                        <input type="checkbox" id="langAll" checked> All
                    </label>
                    <label class="filter-checkbox">
                        <input type="checkbox" class="langFilter" value="en" checked> English
                    </label>
                    <label class="filter-checkbox">
                        <input type="checkbox" class="langFilter" value="ru" checked> Russian
                    </label>
                    <label class="filter-checkbox">
                        <input type="checkbox" class="langFilter" value="other" checked> Other
                    </label>
                </div>
            </div>
        </div>
        
        <div class="header-right">
            <button class="notification-btn" id="notificationBtn" type="button">
                <img src="img/notification.png" alt="Notifications" class="notification-icon">
                <span class="notification-dot" id="notificationDot" hidden></span>
            </button>

            <div class="notification-panel" id="notificationPanel" hidden>
                <h4>Notifications</h4>
                <div id="notificationList">
                    <p class="loading-text">Loading...</p>
                </div>
            </div>

            <div class="user-avatar" id="userAvatarArea">
                <span class="login-hint" id="loginHint" hidden>Войдите в аккаунт</span>
                <div class="avatar-circle" id="avatarCircle">U</div>
            </div>
        </div>
    </header>

    <div class="layout-container">
        <!-- Левое меню (Sidebar) -->
            <aside class="sidebar" id="sidebar">
                <nav class="sidebar-nav">
                    <a href="/profile.html" class="nav-item">
                        <img src="img/profile.png" alt="Home" class="nav-icon"> 
                        <span>Profile</span>
                    </a>
                    <a href="/forum.html" class="nav-item">
                        <img src="img/forum.png" alt="Add" class="nav-icon"> 
                        <span>Forum && Arts</span>
                    </a>
                    <a href="/new-character.html" class="nav-item">
                        <img src="img/add.png" alt="Add" class="nav-icon"> 
                        <span>Add character</span>
                    </a>
                    <a href="/donate.html" class="nav-item">
                        <img src="img/donate.png" alt="Donate" class="nav-icon"> 
                        <span>Donate</span>
                    </a>
                </nav>
                <a href="https://t.me/kayoosh_channel" target="_blank" class="telegram-btn">
                    <img src="img/telegram.png" alt="Telegram" class="nav-icon">
                    <span>Subscribe to dev's Telegram</span>
                </a>
            </aside>

        <!-- Основной контент (Список моделей) -->
        <main class="main-content">
            <h2>Available Characters</h2>
            <div id="character-grid" class="character-grid">
                <!-- Сюда JavaScript добавит карточки персонажей -->
                <p class="loading-text">Loading characters...</p>
            </div>
        </main>
    </div>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <!-- Модалка приглашения ко входу -->
    <div class="modal-overlay" id="authModalOverlay">
        <div class="modal-card">
            <div class="modal-logo">WRP.ai</div>
            <h3>Войдите в аккаунт</h3>
            <p>Чтобы общаться с персонажами и сохранять историю чатов, нужно войти через Google.</p>
            <div class="modal-actions">
                <button class="modal-btn-primary" id="modalLoginBtn">Войти</button>
                <button class="modal-btn-secondary" id="modalCloseBtn">Не сейчас</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { getCachedUser, signOutUser } from '/js/auth.js';

        const MODAL_DISMISSED_KEY = 'wrp_auth_modal_dismissed';

        function updateAuthUi() {
            const user = getCachedUser();
            const avatarCircle = document.getElementById('avatarCircle');
            const loginHint = document.getElementById('loginHint');

            if (user) {
                loginHint.hidden = true;
                if (user.profile.picture) {
                    avatarCircle.style.backgroundImage = `url('${user.profile.picture}')`;
                    avatarCircle.style.backgroundSize = 'cover';
                    avatarCircle.textContent = '';
                } else {
                    avatarCircle.textContent = (user.profile.name || 'U').charAt(0).toUpperCase();
                }
                avatarCircle.onclick = async () => {
                    if (confirm('Выйти из аккаунта?')) {
                        await signOutUser();
                        updateAuthUi();
                    }
                };
            } else {
                loginHint.hidden = false;
                avatarCircle.textContent = 'U';
                avatarCircle.style.backgroundImage = '';
                avatarCircle.onclick = () => {
                    window.location.href = '/login.html';
                };
            }
        }

        function initAuthModal() {
            const user = getCachedUser();
            const overlay = document.getElementById('authModalOverlay');

            if (user) return; // уже вошёл — модалка не нужна
            if (sessionStorage.getItem(MODAL_DISMISSED_KEY)) return; // уже закрывал в этой сессии

            overlay.classList.add('active');

            document.getElementById('modalLoginBtn').addEventListener('click', () => {
                window.location.href = '/login.html';
            });

            document.getElementById('modalCloseBtn').addEventListener('click', () => {
                overlay.classList.remove('active');
                sessionStorage.setItem(MODAL_DISMISSED_KEY, '1');
                updateAuthUi();
            });
        }

        window.toggleMenu = function () {
            const sidebar = document.getElementById('sidebar');
            const menuIcon = document.getElementById('menuIcon');
            const overlay = document.getElementById('overlay');
            
            sidebar.classList.toggle('open');
            menuIcon.classList.toggle('rotated');
            overlay.classList.toggle('active');
        }

        window.startChat = function (charId) {
            window.location.href = `/chat.html?id=${charId}`;
        }

        function updateAdminNav() {
            const user = getCachedUser();
            const adminLink = document.getElementById('adminNavLink');
            adminLink.hidden = !(user && user.profile.email === 'kayoosh2009@gmail.com');
        }

        updateAuthUi();
        initAuthModal();
        updateAdminNav();
    </script>

    <script type="module">
        import { getCachedUser } from '/js/auth.js';

        let allCharacters = [];
        const DESC_LIMIT = 80;

        function renderCharacterCard(char) {
            const card = document.createElement('div');
            card.className = 'character-card';

            const needsToggle = char.description.length > DESC_LIMIT;
            const shortDesc = needsToggle ? char.description.substring(0, DESC_LIMIT) + '...' : char.description;

            card.innerHTML = `
                <div class="card-image" style="background-image: url('${char.avatar_url || 'https://via.placeholder.com/300x200'}');"></div>
                <div class="card-info">
                    <h3>${char.name}</h3>
                    <p class="card-desc">
                        <span class="desc-short">${shortDesc}</span>
                        <span class="desc-full" hidden>${char.description}</span>
                        ${needsToggle ? '<button type="button" class="desc-toggle-btn">more...</button>' : ''}
                    </p>
                    <div class="card-stats"><span>💬 ${char.message_count} messages</span></div>
                    <button class="chat-btn" onclick="startChat('${char.id}')">Start Chat</button>
                </div>
            `;

            if (needsToggle) {
                const toggleBtn = card.querySelector('.desc-toggle-btn');
                const shortEl = card.querySelector('.desc-short');
                const fullEl = card.querySelector('.desc-full');
                toggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isExpanding = fullEl.hidden;
                    fullEl.hidden = !isExpanding;
                    shortEl.hidden = isExpanding;
                    toggleBtn.textContent = isExpanding ? 'less' : 'more...';
                });
            }

            return card;
        }

        function applyFiltersAndRender() {
            const grid = document.getElementById('character-grid');
            const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();

            const checkedViolence = Array.from(document.querySelectorAll('.violenceFilter:checked')).map(cb => cb.value);
            const checkedLangs = Array.from(document.querySelectorAll('.langFilter:checked')).map(cb => cb.value);
            const sortOrder = document.querySelector('input[name="sortOrder"]:checked').value;

            let filtered = allCharacters.filter(char => {
                const matchesSearch = !searchTerm ||
                    char.name.toLowerCase().includes(searchTerm) ||
                    char.description.toLowerCase().includes(searchTerm);

                const matchesViolence = checkedViolence.includes(char.violence_level);

                const langCategory = (char.language === 'en' || char.language === 'ru') ? char.language : 'other';
                const matchesLang = checkedLangs.includes(langCategory);

                return matchesSearch && matchesViolence && matchesLang;
            });

            filtered.sort((a, b) => sortOrder === 'popular'
                ? b.message_count - a.message_count
                : a.message_count - b.message_count);

            grid.innerHTML = '';
            if (filtered.length === 0) {
                grid.innerHTML = '<p class="loading-text">No characters found.</p>';
                return;
            }
            filtered.forEach(char => grid.appendChild(renderCharacterCard(char)));
        }

        function setupFilterControls() {
            document.getElementById('searchInput').addEventListener('input', applyFiltersAndRender);

            document.querySelectorAll('input[name="sortOrder"]').forEach(radio => {
                radio.addEventListener('change', applyFiltersAndRender);
            });

            const violenceAll = document.getElementById('violenceAll');
            const violenceCheckboxes = document.querySelectorAll('.violenceFilter');
            violenceAll.addEventListener('change', () => {
                violenceCheckboxes.forEach(cb => cb.checked = violenceAll.checked);
                applyFiltersAndRender();
            });
            violenceCheckboxes.forEach(cb => {
                cb.addEventListener('change', () => {
                    violenceAll.checked = Array.from(violenceCheckboxes).every(c => c.checked);
                    applyFiltersAndRender();
                });
            });

            const langAll = document.getElementById('langAll');
            const langCheckboxes = document.querySelectorAll('.langFilter');
            langAll.addEventListener('change', () => {
                langCheckboxes.forEach(cb => cb.checked = langAll.checked);
                applyFiltersAndRender();
            });
            langCheckboxes.forEach(cb => {
                cb.addEventListener('change', () => {
                    langAll.checked = Array.from(langCheckboxes).every(c => c.checked);
                    applyFiltersAndRender();
                });
            });

            const filterToggleBtn = document.getElementById('filterToggleBtn');
            const filterPanel = document.getElementById('filterPanel');
            filterToggleBtn.addEventListener('click', () => {
                filterPanel.hidden = !filterPanel.hidden;
            });
            document.addEventListener('click', (e) => {
                if (!filterPanel.hidden && !filterPanel.contains(e.target) && e.target !== filterToggleBtn) {
                    filterPanel.hidden = true;
                }
            });
        }

        // Загрузка персонажей
        document.addEventListener('DOMContentLoaded', async () => {
            setupFilterControls();
            try {
                const response = await fetch('/api/characters');
                if (!response.ok) throw new Error('Failed to fetch');
                allCharacters = await response.json();
                applyFiltersAndRender();
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('character-grid').innerHTML =
                    '<p class="error-text">Failed to load characters. Please try again later.</p>';
            }
        });

        window.startChat = function (charId) {
            if (!getCachedUser()) {
                window.location.href = '/login.html';
                return;
            }
            window.location.href = `/chat.html?id=${charId}`;
        }
    </script>

    <script type="module">
        const LAST_SEEN_KEY = 'wrp_notifications_last_seen';

        const notificationBtn = document.getElementById('notificationBtn');
        const notificationPanel = document.getElementById('notificationPanel');
        const notificationList = document.getElementById('notificationList');
        const notificationDot = document.getElementById('notificationDot');

        let notifications = [];

        function formatTime(ts) {
            const date = new Date(ts);
            return date.toLocaleString();
        }

        function renderNotifications() {
            if (notifications.length === 0) {
                notificationList.innerHTML = '<p class="loading-text">No notifications yet.</p>';
                return;
            }
            notificationList.innerHTML = notifications.map(n => `
                <div class="notification-item">
                    <div class="n-title">${n.title}</div>
                    <div class="n-message">${n.message}</div>
                    <div class="n-time">${formatTime(n.timestamp)}</div>
                </div>
            `).join('');
        }

        function updateDot() {
            const lastSeen = parseInt(localStorage.getItem(LAST_SEEN_KEY) || '0', 10);
            const hasUnread = notifications.some(n => n.timestamp > lastSeen);
            notificationDot.hidden = !hasUnread;
        }

        async function loadNotifications() {
            try {
                const res = await fetch('/api/notifications');
                if (!res.ok) throw new Error('Failed to fetch notifications');
                notifications = await res.json();
                renderNotifications();
                updateDot();
            } catch (err) {
                console.error('Error loading notifications:', err);
                notificationList.innerHTML = '<p class="error-text">Failed to load notifications.</p>';
            }
        }

        notificationBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            notificationPanel.hidden = !notificationPanel.hidden;
            if (!notificationPanel.hidden && notifications.length > 0) {
                localStorage.setItem(LAST_SEEN_KEY, String(notifications[0].timestamp));
                notificationDot.hidden = true;
            }
        });

        document.addEventListener('click', (e) => {
            if (!notificationPanel.hidden && !notificationPanel.contains(e.target) && e.target !== notificationBtn) {
                notificationPanel.hidden = true;
            }
        });

        loadNotifications();
    </script>
</body>
</html>
