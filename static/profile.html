<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRP.ai — Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="top-bar">
        <div class="header-left">
            <a href="/" class="back-link">← Back</a>
            <div class="logo">WRP.ai</div>
        </div>
    </header>

    <div class="profile-page">
        <div class="profile-header">
            <div class="profile-avatar-wrap">
                <img class="profile-avatar-img" id="profileAvatarImg" alt="" referrerpolicy="no-referrer" style="display:none;">
                <div class="profile-avatar-fallback" id="profileAvatarFallback">U</div>
            </div>
            <div>
                <div class="profile-name-row">
                    <div class="profile-name" id="profileName">Loading...</div>
                    <input class="profile-name-input" id="profileNameInput" type="text" maxlength="40" style="display:none;">
                    <button class="name-edit-btn" id="nameEditBtn" title="Edit name">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 20h9"></path>
                            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
                        </svg>
                    </button>
                    <button class="name-save-btn" id="nameSaveBtn" style="display:none;">Save</button>
                </div>
                <div class="profile-email" id="profileEmail"></div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="statMessagesSent">—</div>
                <div class="stat-label">Messages sent to characters</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statCharactersCreated">—</div>
                <div class="stat-label">Characters created</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statForumMessages">—</div>
                <div class="stat-label">Forum messages</div>
            </div>
        </div>

        <hr class="profile-divider">

        <div class="profile-columns">
            <div class="profile-column">
                <h2>My forum board</h2>
                <div class="forum-placeholder">
                    Forum is coming soon. Your posts will show up here.
                </div>
            </div>

            <div class="profile-column">
                <h2>My characters</h2>
                <div id="myCharactersGrid" class="character-grid">
                    <p class="loading-text">Loading your characters...</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { requireAuthOrRedirect, authFetch } from '/js/auth.js';

        const user = requireAuthOrRedirect();

        if (user) {
            const avatarImgEl = document.getElementById('profileAvatarImg');
            const avatarFallbackEl = document.getElementById('profileAvatarFallback');
            const nameEl = document.getElementById('profileName');
            const nameInputEl = document.getElementById('profileNameInput');
            const nameEditBtn = document.getElementById('nameEditBtn');
            const nameSaveBtn = document.getElementById('nameSaveBtn');
            const emailEl = document.getElementById('profileEmail');

            let currentName = user.profile.name || 'Unnamed user';
            nameEl.textContent = currentName;
            emailEl.textContent = user.profile.email || '';
            avatarFallbackEl.textContent = currentName.charAt(0).toUpperCase();

            function showAvatarPhoto() {
                avatarImgEl.style.display = 'block';
                avatarFallbackEl.style.display = 'none';
            }

            function showAvatarFallback() {
                avatarImgEl.style.display = 'none';
                avatarFallbackEl.style.display = 'flex';
            }

            if (user.profile.picture) {
                avatarImgEl.addEventListener('load', showAvatarPhoto);
                avatarImgEl.addEventListener('error', showAvatarFallback);
                avatarImgEl.src = user.profile.picture;
            } else {
                showAvatarFallback();
            }

            function enterEditMode() {
                nameInputEl.value = currentName;
                nameEl.style.display = 'none';
                nameEditBtn.style.display = 'none';
                nameInputEl.style.display = 'inline-block';
                nameSaveBtn.style.display = 'inline-block';
                nameInputEl.focus();
                nameInputEl.select();
            }

            function exitEditMode() {
                nameEl.style.display = '';
                nameEditBtn.style.display = '';
                nameInputEl.style.display = 'none';
                nameSaveBtn.style.display = 'none';
            }

            async function saveName() {
                const newName = nameInputEl.value.trim();
                if (!newName || newName === currentName) {
                    exitEditMode();
                    return;
                }

                nameSaveBtn.disabled = true;
                try {
                    // NOTE: бэкенд-эндпоинт для смены имени пока не реализован.
                    // Нужно добавить POST /api/profile/update-name в main.rs,
                    // который обновит displayName в Firebase и/или в БД.
                    const res = await authFetch('/api/profile/update-name', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: newName }),
                    });
                    if (!res.ok) throw new Error(`Server responded with ${res.status}`);

                    currentName = newName;
                    nameEl.textContent = currentName;
                    avatarFallbackEl.textContent = currentName.charAt(0).toUpperCase();
                } catch (err) {
                    console.error('Error updating name:', err);
                    alert('Failed to save name. Please try again.');
                } finally {
                    nameSaveBtn.disabled = false;
                    exitEditMode();
                }
            }

            nameEditBtn.addEventListener('click', enterEditMode);
            nameSaveBtn.addEventListener('click', saveName);
            nameInputEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') saveName();
                if (e.key === 'Escape') exitEditMode();
            });

            async function loadStats() {
                try {
                    const res = await authFetch('/api/profile/stats');
                    if (!res.ok) throw new Error(`Server responded with ${res.status}`);
                    const stats = await res.json();

                    document.getElementById('statMessagesSent').textContent = stats.messages_sent;
                    document.getElementById('statCharactersCreated').textContent = stats.characters_created;
                    document.getElementById('statForumMessages').textContent = stats.forum_messages;
                } catch (err) {
                    console.error('Error loading profile stats:', err);
                }
            }

            async function loadMyCharacters() {
                const grid = document.getElementById('myCharactersGrid');
                try {
                    const res = await authFetch('/api/profile/characters');
                    if (!res.ok) throw new Error(`Server responded with ${res.status}`);
                    const characters = await res.json();

                    if (characters.length === 0) {
                        grid.innerHTML = '<p class="loading-text">You haven\'t created any characters yet.</p>';
                        return;
                    }

                    grid.innerHTML = '';
                    characters.forEach((char) => {
                        const card = document.createElement('div');
                        card.className = 'character-card';
                        card.innerHTML = `
                            <div class="card-image" style="background-image: url('${char.avatar_url || 'https://via.placeholder.com/300x200'}');"></div>
                            <div class="card-info">
                                <h3>${char.name}</h3>
                                <p>${char.description.substring(0, 80)}...</p>
                                <div class="card-stats"><span>💬 ${char.message_count} messages</span></div>
                                <button class="chat-btn" onclick="window.location.href='/chat.html?id=${char.id}'">Start Chat</button>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                } catch (err) {
                    console.error('Error loading your characters:', err);
                    grid.innerHTML = '<p class="error-text">Failed to load your characters.</p>';
                }
            }

            loadStats();
            loadMyCharacters();
        }
    </script>
</body>
</html>
